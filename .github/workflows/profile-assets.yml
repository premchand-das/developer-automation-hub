name: Profile Assets

on:
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/profile-assets.yml"]

permissions:
  contents: write

concurrency:
  group: profile-assets
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Generate contribution animation
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: premchand-das
          outputs: |
            dist/snake.svg
            dist/snake-dark.svg?palette=github-dark

      - name: Generate public repository statistics
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 <<'PY'
          import json
          import os
          import urllib.request
          from pathlib import Path
          from datetime import datetime, timezone
          from html import escape
          from urllib.parse import quote

          login = "premchand-das"
          repos = []
          for page in range(1, 101):
              url = f"https://api.github.com/users/{login}/repos?type=owner&sort=pushed&per_page=100&page={page}"
              req = urllib.request.Request(url, headers={
                  "Authorization": "Bearer " + os.environ["GH_TOKEN"],
                  "Accept": "application/vnd.github+json",
                  "User-Agent": "profile-assets",
              })
              with urllib.request.urlopen(req, timeout=20) as response:
                  batch = json.load(response)
              repos.extend(r for r in batch if not r["private"]
                           and not r["fork"] and r["name"] != login)
              if len(batch) < 100:
                  break
          else:
              raise RuntimeError("Repository pagination limit reached")

          out = Path("dist")
          out.mkdir(exist_ok=True)
          labels = [
              ("PUBLIC PROJECTS", len(repos)),
              ("STARS", sum(r["stargazers_count"] for r in repos)),
              ("FORKS", sum(r["forks_count"] for r in repos)),
              ("PRIMARY LANGUAGES", len({r["language"] for r in repos if r["language"]})),
          ]
          parts = ['<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 148" role="img" aria-label="Public project statistics">',
                   '<rect width="640" height="148" rx="16" fill="#10131b"/>',
                   '<text x="24" y="30" fill="#c4b5fd" font-size="13" font-family="sans-serif">PUBLIC REPOSITORY SNAPSHOT</text>']
          for i, (label, value) in enumerate(labels):
              x = 24 + 154 * i
              parts.append(f'<text x="{x}" y="81" fill="#f8fafc" font-size="30" font-weight="bold" font-family="sans-serif">{value}</text>')
              parts.append(f'<text x="{x}" y="104" fill="#94a3b8" font-size="11" font-family="sans-serif">{escape(label)}</text>')
          parts.append('<text x="24" y="132" fill="#94a3b8" font-size="10" font-family="sans-serif">Excludes forks and the profile repository.</text></svg>')
          (out / "stats.svg").write_text("".join(parts), encoding="utf-8")

          lines = ["# Recently updated public projects", "",
                   "Generated automatically from GitHub's public repository API.",
                   "", "| Repository | Primary language | Stars |", "| --- | --- | ---: |"]
          for r in sorted(repos, key=lambda r: r["pushed_at"], reverse=True)[:12]:
              name = r["name"].replace("|", "&#124;").replace("[", "&#91;").replace("]", "&#93;")
              url = f"https://github.com/{login}/{quote(r['name'], safe='')}"
              language = (r["language"] or "—").replace("|", "&#124;")
              lines.append(f"| [{name}]({url}) | {language} | {r['stargazers_count']} |")
          lines.extend(["", "Updated: " + datetime.now(timezone.utc).isoformat()])
          (out / "projects.md").write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY

      - name: Publish generated assets to dedicated branch
        shell: bash
        run: |
          set -euo pipefail
          cp -R dist "$RUNNER_TEMP/profile-assets"
          rm -rf dist

          if git ls-remote --exit-code --heads origin profile-artifacts >/dev/null; then
            git fetch origin refs/heads/profile-artifacts:refs/remotes/origin/profile-artifacts
            git switch -C profile-artifacts origin/profile-artifacts
          else
            git switch --orphan profile-artifacts
          fi

          cp -R "$RUNNER_TEMP/profile-assets/." .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add snake.svg snake-dark.svg stats.svg projects.md
          if git diff --cached --quiet; then
            echo "Assets unchanged."
            exit 0
          fi
          git commit -m "chore: refresh generated profile assets"
          git push origin HEAD:refs/heads/profile-artifacts
