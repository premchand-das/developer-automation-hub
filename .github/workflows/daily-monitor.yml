
name: Daily Developer Automation

on:
  schedule:
    - cron: "47 3 * * *"
    - cron: "47 9 * * *"
    - cron: "47 15 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-monitor
  cancel-in-progress: false

jobs:
  daily-monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate monitoring report
        env:
          MONITOR_SCHEDULE: ${{ github.event.schedule }}
        run: |
          python3 <<'PY'
          from datetime import datetime
          from zoneinfo import ZoneInfo
          from pathlib import Path
          import urllib.request
          import time
          import os

          now = datetime.now(ZoneInfo("Asia/Kolkata"))
          date = now.strftime("%Y-%m-%d")
          slots = {
              "47 3 * * *": "morning",
              "47 9 * * *": "afternoon",
              "47 15 * * *": "evening",
          }
          manual_slot = "morning" if now.hour < 15 else ("afternoon" if now.hour < 21 else "evening")
          slot = slots.get(os.environ.get("MONITOR_SCHEDULE", ""), manual_slot)

          reports = Path("reports")
          reports.mkdir(exist_ok=True)
          report = reports / f"{date}-{slot}.md"

          if report.exists():
              print("This monitoring slot already has a report.")
              raise SystemExit(0)

          urls = {
              "Covisioner Website": "https://covisioner.com",
              "Covisioner API": "https://api.covisioner.com/health"
          }

          rows = [
              "| Service | Status | Response time |",
              "|---|---|---|"
          ]

          for name, url in urls.items():
              start = time.monotonic()
              try:
                  with urllib.request.urlopen(url, timeout=15) as res:
                      status = f"HTTP {res.status}"
              except Exception:
                  status = "Check failed"

              duration = round(time.monotonic() - start, 2)
              rows.append(f"| {name} | {status} | {duration}s |")

          content = "\n".join([
              f"## Service Report — {date} ({slot})",
              "",
              f"Generated: {now.isoformat()}",
              "",
              *rows,
              "",
              "Automatically generated by GitHub Actions."
          ])

          report.write_text(content + "\n", encoding="utf-8")

          Path("README.md").write_text(
              "# Developer Automation Hub\n\n"
              "Automated service monitoring — 09:17, 15:17 and 21:17 IST.\n\n"
              "[![Daily Developer Automation](https://github.com/premchand-das/developer-automation-hub/actions/workflows/daily-monitor.yml/badge.svg)](https://github.com/premchand-das/developer-automation-hub/actions/workflows/daily-monitor.yml)\n\n"
              + content +
              f"\n\n[Source report]({report.as_posix()}) | [Monitoring History](reports/)\n"
              "\nDaily snapshots, not continuous uptime.\n"
              "\nScheduled commits are automated, not manual coding activity.\n",
              encoding="utf-8"
          )
          PY

      - name: Commit and push
        run: |
          git config user.name "premchand-das"
          git config user.email "103174582+premchand-das@users.noreply.github.com"

          git add README.md reports/

          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi

          git commit -m "chore: automated service health snapshot"
          git push origin main
